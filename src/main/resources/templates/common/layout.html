<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hospital San Rafael De Tunja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/LogoUp.png}">
    <link rel="stylesheet" th:href="@{/css/Style.css}">
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-50">
<header th:fragment="header" class="fixed top-0 left-0 right-0 z-50 w-full shadow-md">

    <nav class="w-full h-10 bg-[#004884] flex items-center px-4 sm:px-6 lg:px-8 select-none barra-superior-govco">
        <a href="https://www.gov.co" target="_blank" aria-label="Portal del Estado Colombiano - GOV.CO" class="flex items-center"></a>
    </nav>
    <nav class="w-full h-20 bg-white/95 backdrop-blur border-b border-slate-200 flex items-center">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a th:href="@{/login}"
                   class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-medium transition-all duration-200 shadow-md text-sm tracking-wide group">
                    <svg class="w-4 h-4 mr-2 text-blue-100 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                    Acceso administrativo
                </a>
                <form th:action="@{/logout}" method="post" class="inline-block">
                    <button type="submit"
                            class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium transition-all duration-200 shadow-md text-sm tracking-wide group">
                        <svg class="w-4 h-4 mr-2 text-red-100 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Salir
                    </button>
                </form>
                <a th:href="@{/productos}"
                   class="inline-flex items-center px-3 py-2 rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 font-medium transition-all duration-200 text-sm group">
                    <svg class="w-5 h-5 mr-1.5 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    Productos
                </a>
                <a th:href="@{/reportes}"
                   class="inline-flex items-center px-3 py-2 rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 font-medium transition-all duration-200 text-sm group">
                    <svg class="w-5 h-5 mr-1.5 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Reportes
                </a>
                <a th:href="@{/eventos}"
                   class="inline-flex items-center px-3 py-2 rounded-xl text-slate-600 hover:text-blue-600 hover:bg-blue-50 font-medium transition-all duration-200 text-sm group">
                    <svg class="w-5 h-5 mr-1.5 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    Eventos
                </a>

            </div>
            <a th:href="@{/}" class="flex items-center gap-3 h-14">
                <img th:src="@{/images/Nuevo1.png}" alt="HospitalSanRafael" class="h-full w-auto object-contain">
                <div class="w-[2px] h-10 bg-sky-500 rounded-full"></div>
                <img th:src="@{/images/Nuevo2.png}" alt="HospitalSanRafael" class="h-full w-auto object-contain">
            </a>

        </div>
    </nav>
</header>
<footer th:fragment="footer"
        class="w-full bg-sky-950 border-t border-sky-800 text-gray-300">

    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">

            <img th:src="@{/images/LogoUp.png}"
                 alt="San Rafa"
                 class="h-10 w-auto object-contain">

            <div class="text-sm">
                <p class="font-semibold text-white">E.S.E Hospital Universitario San Rafael de Tunja</p>
                <p class="text-sky-400 text-xs">Sistema de Estado Operacional</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-sm">
            <div class="w-2 h-2 rounded-full bg-green-400"></div>
            <span>Todos los servicios operativos</span>
        </div>
        <p class="text-xs text-white-400 text-center md:text-right">© 2026 Hospital Universitario San Rafael de Tunja</p>
    </div>
</footer>
</body>
</html>
