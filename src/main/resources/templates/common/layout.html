<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hospital San Rafael De Tunja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/LogoUp.png}">
</head>

<body class="bg-slate-50 pt-2">
<header th:fragment="header">
    <!-- CONTENEDOR FIJO PRINCIPAL: Mantiene unida la barra y el menú en el techo de la pantalla -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md shadow-lg border-b border-slate-300">

        <!-- Barra Gobierno -->
        <div class="w-full bg-[#F8FAFC] h-20 flex items-center justify-between px-4 sm:px-6 lg:px-8 select-none">

            <div class="flex items-center h-full">

                <a href="https://www.gov.co"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="flex items-center gap-5 hover:opacity-90 transition-opacity h-full py-2">

                    <img th:src="@{/images/gobierno.png}"
                         alt="Logo GOV.CO"
                         class="h-full w-auto object-contain scale-125">

                </a>

            </div>

        </div>

    </div>
        <!-- 1. Barra Hospital, Logo y botones-->
        <nav class="bg-white/75 backdrop-blur border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24">
                <div class="flex items-center justify-between h-full">
                    <a th:href="@{/}" class="flex items-center gap-4 h-full py-2">
                        <img th:src="@{/images/Logo3.png}"
                             alt="HospitalSanRafael"
                             class="h-full w-auto object-contain">
                    </a>
                    <div class="hidden md:flex items-center gap-8">
                        <div class="flex items-center gap-3 ml-4">
                            <a th:href="@{/login}"
                               class="inline-flex px-5 py-2.5 rounded-xl bg-sky-700 hover:bg-sky-900 text-white font-bold transition-all shadow-sm text-sm tracking-wide">
                                Login
                            </a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit"
                                        class="inline-flex px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-900 text-white font-bold transition-all shadow-sm text-sm tracking-wide">
                                    Logout
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>


<footer th:fragment="footer" class="w-full text-white py-4 bg-sky-800 border-t border-sky-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-center items-center gap-4 text-center sm:text-left">
        <img th:src="@{/images/Logo2.jpeg}" alt="Hospital Universitario San Rafael" class="h-10 w-10 rounded-full bg-white p-0.5 shadow-sm">
        <p class="text-sm font-medium tracking-wide">
            © Copyright 2025 - E.S.E. Hospital Universitario San Rafael Tunja - Todos los derechos reservados
        </p>
    </div>
</footer>
</body>
</html>
