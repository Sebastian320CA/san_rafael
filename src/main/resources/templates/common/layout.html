<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hospital San Rafael De Tunja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/LogoUp.png}">
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>

<body class="bg-slate-50">
<header th:fragment="header" class="fixed top-0 left-0 right-0 z-50 w-full shadow-md">

    <!-- 1. Franja Azul Superior de GOV.CO -->
    <nav class="w-full h-10 bg-[#004884] flex items-center px-4 sm:px-6 lg:px-8 select-none barra-superior-govco">
        <a href="https://www.gov.co" target="_blank" aria-label="Portal del Estado Colombiano - GOV.CO" class="flex items-center"></a>
    </nav>

    <!-- 2. Barra Principal del Hospital (Alineación interna corregida con flex e items-center) -->
    <nav class="w-full h-20 bg-white/95 backdrop-blur border-b border-slate-200 flex items-center">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">

            <!-- Bloque Izquierdo: Botones -->
            <div class="flex items-center gap-3">
                <a th:href="@{/login}"
                   class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-[#2563eb] hover:bg-[#1d4ed8]
                          text-white font-medium transition-all duration-200 shadow-md text-sm tracking-wide group">
                    <svg class="w-4 h-4 mr-2 text-blue-100 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-7.5A2.25 2.25 0 003.75 5.25v13.5A2.25 2.25 0 006 21h7.5a2.25 2.25 0 002.25-2.25V15"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H9m0 0l3-3m-3 3l3 3"/>
                    </svg>
                    Acceso administrativo
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700
                                   text-white font-medium transition-all duration-200 shadow-sm text-sm tracking-wide group">
                        <svg class="w-4 h-4 mr-2 text-red-100 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12h4"/>
                        </svg>
                        Salir
                    </button>
                </form>
            </div>
            <a th:href="@{/}" class="flex items-center gap-3 h-14">
                <img th:src="@{/images/Nuevo1.png}" alt="HospitalSanRafael" class="h-full w-auto object-contain">
                <div class="w-[2px] h-10 bg-sky-500 rounded-full"></div>
                <img th:src="@{/images/Nuevo2.png}" alt="HospitalSanRafael" class="h-full w-auto object-contain">
            </a>

        </div>
    </nav>
</header>



<footer th:fragment="footer"
        class="w-full bg-sky-950 border-t border-sky-800 text-gray-300">

    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">

            <img th:src="@{/images/LogoUp.png}"
                 alt="San Rafa"
                 class="h-10 w-auto object-contain">

            <div class="text-sm">
                <p class="font-semibold text-white">E.S.E Hospital Universitario San Rafael de Tunja</p>
                <p class="text-sky-400 text-xs">Sistema de Estado Operacional</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-sm">
            <div class="w-2 h-2 rounded-full bg-green-400"></div>
            <span>Todos los servicios operativos</span>
        </div>
        <p class="text-xs text-white-400 text-center md:text-right">© 2026 Hospital Universitario San Rafael de Tunja</p>
    </div>
</footer>
</body>
</html>
