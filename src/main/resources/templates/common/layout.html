<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hospital San Rafael De Tunja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/LogoUp.png}">
</head>

<body class="bg-slate-50">
<header th:fragment="header">
    <!--COntenedor encargado de la imagen superior que redirije a la Pagina oficial del Gobierno de Colombia.-->
    <div class="fixed top-0 left-0 right-0 z-50 bg-blue-600/95 backdrop-blur-md shadow-lg border-b border-blue-700">
        <div class="w-full bg-blue-600 h-14 flex items-center justify-between px-4 sm:px-6 lg:px-8 select-none">
            <div class="flex items-center h-full">
                <a href="https://www.gov.co"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="flex items-center gap-5 hover:opacity-90 transition-opacity h-full py-2">
                    <img th:src="@{/images/Gobierno2.png}"
                         alt="Logo GOV.CO"
                         class="h-full w-auto object-contain scale-125">
                </a>
            </div>
        </div>
    </div>
        <!-- Barra con el logo del hospital junto con los botones para el ingreso de administrador-->
        <nav class="bg-white/75 backdrop-blur border-b border-slate-200 -mt-14">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-full">
                    <!--Botones-->
                    <div class="flex items-center gap-3">
                        <a th:href="@{/login}"
                           class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-[#2563eb] hover:bg-[#1d4ed8]
                                  text-white font-medium transition-all duration-200 shadow-md text-sm tracking-wide group">
                            <svg class="w-4 h-4 mr-2 text-blue-100 group-hover:text-white transition-colors"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-7.5A2.25 2.25 0 003.75 5.25v13.5A2.25 2.25 0 006
                                        21h7.5a2.25 2.25 0 002.25-2.25V15"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M18 12H9m0 0l3-3m-3 3l3 3"/>
                            </svg>

                            Acceso administrativo
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type='submit'
                            class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700
                                    text-white font-medium transition-all duration-200 shadow-sm text-sm tracking-wide group">
                                <svg class="w-4 h-4 mr-2 text-red-100 group-hover:text-white transtition-colors"
                                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 12h4"/>
                                </svg>
                                Salir
                            </button>
                        </form>

                    </div>
                    <a th:href="@{/}" class="flex items-center gap-2">
                        <img th:src="@{/images/Nuevo1.png}"
                             alt="HospitalSanRafael"
                             class="h-20 w-auto object-contain -mt-4">
                        <!--Barra intermedia entre logos institucionales-->
                        <div class="w-[2px] h-24 bg-sky-500 rounded-full"></div>
                        <img th:src="@{/images/Nuevo2.png}"
                             alt="HospitalSanRafael"
                             class="h-20 w-auto object-contain -mt-4">
                    </a>

                </div>
            </div>
        </nav>
</header>


<footer th:fragment="footer"
        class="w-full bg-sky-950 border-t border-sky-800 text-gray-300">

    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">

            <img th:src="@{/images/LogoUp.png}"
                 alt="San Rafa"
                 class="h-10 w-auto object-contain">

            <div class="text-sm">
                <p class="font-semibold text-white">E.S.E Hospital Universitario San Rafael de Tunja</p>
                <p class="text-sky-400 text-xs">Sistema de Estado Operacional</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-sm">
            <div class="w-2 h-2 rounded-full bg-green-400"></div>
            <span>Todos los servicios operativos</span>
        </div>
        <p class="text-xs text-white-400 text-center md:text-right">© 2026 Hospital Universitario San Rafael de Tunja</p>
    </div>
</footer>
</body>
</html>
